name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lip
          POSTGRES_PASSWORD: lip
          POSTGRES_DB: lip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lip"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      LIP_DATABASE_URL: postgresql+psycopg://lip:lip@localhost:5432/lip_test
      LIP_REDIS_URL: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Mypy type-check (non-blocking baseline)
        run: mypy src || true

      - name: Run migrations
        run: alembic upgrade head

      - name: Pytest
        run: pytest -q
