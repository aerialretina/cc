name: Scrape all sources on laborint

# UI-only fan-out. The workflow drives the loop (rather than the server
# doing it in one long request), so each call to /admin/scrape/{name}
# stays well inside Fly's HTTP timeout and per-spider progress shows
# up live in the Actions log.

on:
  workflow_dispatch:
    inputs:
      max_postings_per_spider:
        description: Per-spider posting cap
        required: true
        default: "20"
        type: string
      base_url:
        description: App URL
        required: true
        default: https://laborint.fly.dev
        type: string

jobs:
  scrape-all:
    name: scrape-all
    runs-on: ubuntu-latest
    steps:
      - name: Fan out across registered spiders
        env:
          ADMIN_TOKEN: ${{ secrets.LIP_ADMIN_TOKEN }}
          MAX: ${{ inputs.max_postings_per_spider }}
          BASE_URL: ${{ inputs.base_url }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_TOKEN}" ]; then
            echo "::error::LIP_ADMIN_TOKEN repo secret is not set"
            exit 1
          fi

          echo "== Fetching registered spider list =="
          status=$(curl -sS -o spiders.json -w "%{http_code}" \
            -H "X-Admin-Token: ${ADMIN_TOKEN}" \
            "${BASE_URL}/admin/spiders")
          if [ "${status}" != "200" ]; then
            echo "::error::GET /admin/spiders returned HTTP ${status}"
            cat spiders.json
            exit 1
          fi
          spiders=$(jq -r '.spiders[]' spiders.json)
          count=$(echo "${spiders}" | wc -l | tr -d ' ')
          echo "Found ${count} spiders"
          echo

          total_seen=0
          total_ingested=0
          total_enriched=0
          final_canonical=0
          final_raw=0
          ok_count=0
          fail_count=0
          empty_count=0

          while IFS= read -r name; do
            [ -z "${name}" ] && continue
            printf "%-30s " "${name}"
            status=$(curl -sS -o resp.json -w "%{http_code}" \
              -X POST \
              -H "X-Admin-Token: ${ADMIN_TOKEN}" \
              --max-time 90 \
              "${BASE_URL}/admin/scrape/${name}?max_postings=${MAX}" || echo "000")
            if [ "${status}" != "200" ]; then
              fail_count=$((fail_count + 1))
              detail=$(jq -r '.detail // "(no detail)"' resp.json 2>/dev/null || echo "(no body)")
              printf "HTTP %s  %s\n" "${status}" "${detail}"
              continue
            fi
            seen=$(jq -r '.seen // 0' resp.json)
            ingested=$(jq -r '.ingested_raw // 0' resp.json)
            enriched=$(jq -r '.enriched // 0' resp.json)
            err=$(jq -r '.upstream_error // empty' resp.json)
            final_canonical=$(jq -r '.canonical_postings_total // 0' resp.json)
            final_raw=$(jq -r '.raw_postings_total // 0' resp.json)
            total_seen=$((total_seen + seen))
            total_ingested=$((total_ingested + ingested))
            total_enriched=$((total_enriched + enriched))
            if [ -n "${err}" ]; then
              fail_count=$((fail_count + 1))
              printf "ERROR   seen=%s  -- %s\n" "${seen}" "${err}"
            elif [ "${seen}" = "0" ]; then
              empty_count=$((empty_count + 1))
              printf "EMPTY   no postings yielded\n"
            else
              ok_count=$((ok_count + 1))
              printf "OK      seen=%s  ingested=%s  enriched=%s\n" "${seen}" "${ingested}" "${enriched}"
            fi
          done <<< "${spiders}"

          echo
          echo "================ summary ================"
          echo "Spiders run:           ${count}"
          echo "  succeeded (seen>0):  ${ok_count}"
          echo "  upstream-empty:      ${empty_count}"
          echo "  failed:              ${fail_count}"
          echo "Totals across spiders: seen=${total_seen} ingested=${total_ingested} enriched=${total_enriched}"
          echo "Canonical postings now: ${final_canonical}"
          echo "Raw postings now:       ${final_raw}"
