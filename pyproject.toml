[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lip"
version = "0.1.0"
description = "Labor Intelligence Platform — industrial labor graph (construction, energy, industrial)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "redis>=5.0",
    "celery>=5.4",
    "httpx>=0.27",
    "tenacity>=8.5",
    "boto3>=1.34",
    "structlog>=24.4",
    "python-dateutil>=2.9",
    "rapidfuzz>=3.9",
    "shapely>=2.0",
]

[project.optional-dependencies]
scraping = [
    "scrapy>=2.11",
    "playwright>=1.46",
    "scrapy-playwright>=0.0.34",
    "lxml>=5.2",
    "beautifulsoup4>=4.12",
]
ml = [
    "sentence-transformers>=3.0",
    "transformers>=4.44",
    "torch>=2.4",
    "scikit-learn>=1.5",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-python-dateutil",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
# B008: FastAPI uses Depends/Query in argument defaults by design.
# N802: SQLAlchemy convention uses CamelCase for session factories like
#       SessionLocal; we follow it deliberately.
ignore = ["E501", "B008", "N802"]

[tool.ruff.lint.per-file-ignores]
# Compensation regex deliberately accepts en-dash (typographic range marker)
# in addition to the ASCII hyphen — the literal must appear in source.
"src/lip/enrichment/compensation.py" = ["RUF001"]
# UI uses the typographic en-dash for salary ranges and short-dash for
# em-dash in copy. Allow both in this file.
"src/lip/ui/render.py" = ["RUF001"]
"src/lip/ui/router.py" = ["RUF001", "RUF005"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
