# Fly.io deployment for the Labor Intelligence Platform.
#
# Replace `app` with a unique name and `primary_region` with your nearest
# Fly region (https://fly.io/docs/reference/regions/). Run `fly launch
# --no-deploy --copy-config` to register the app, then follow
# docs/deploy-fly.md.

app = "lip"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"

[env]
  LIP_ENV = "production"
  LIP_LOG_LEVEL = "INFO"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[deploy]
  # Migrations run on container boot (alembic upgrade head in the CMD),
  # so no separate release_command is needed. Set one here if you'd
  # rather migrate before machines roll.
